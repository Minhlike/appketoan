[package]
name = "reconciliation-core"
version = "0.1.0"
edition = "2021"
description = "Core Domain Models, Streaming Excel Ingestion, Normalization, and Multi-Source Reconciliation Engine"

[dependencies]
calamine = "0.26"
rust_xlsxwriter = "0.79"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rust_decimal = { version = "1.36", features = ["serde", "serde-with-str", "maths"] }
rust_decimal_macros = "1.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
